apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-monitoring-dev
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: confluent
  source:
    repoURL: https://github.com/YOUR_ORG/openshift-cfk-gitops.git
    targetRevision: main
    path: environments/dev/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: confluent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
