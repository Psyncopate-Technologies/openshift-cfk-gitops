apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: confluent-scc
  annotations:
    kubernetes.io/description: |
      Security Context Constraints for Confluent Platform components.
      Allows running as UID 1000 which is required by Confluent containers.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 1000
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 1000
  uidRangeMax: 1000
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 1000
users:
  - system:serviceaccount:confluent:default
  - system:serviceaccount:confluent:kafka
  - system:serviceaccount:confluent:kraftcontroller
  - system:serviceaccount:confluent:schemaregistry
  - system:serviceaccount:confluent:connect
  - system:serviceaccount:confluent:ksqldb
  - system:serviceaccount:confluent:controlcenter
  - system:serviceaccount:confluent:kafkarestproxy
  - system:serviceaccount:confluent-operator:confluent-for-kubernetes
groups: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
