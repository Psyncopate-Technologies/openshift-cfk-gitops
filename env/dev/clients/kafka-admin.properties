# =============================================================================
# Kafka Admin Client Configuration - Dev Environment
# =============================================================================
# Bootstrap server: External access via OpenShift Route
# =============================================================================

bootstrap.servers=kafka.dev.confluent.psyncopate.io:443

# =============================================================================
# Security Configuration (TLS)
# =============================================================================

security.protocol=SSL
ssl.truststore.location=./truststore.jks
ssl.truststore.password=changeit

ssl.keystore.location=./keystore.jks
ssl.keystore.password=mystorepassword
ssl.key.password=mystorepassword

# Disable hostname verification (required because autoGeneratedCerts
# don't include custom domain SANs)
ssl.endpoint.identification.algorithm=

# =============================================================================
# Client Settings
# =============================================================================

client.id=kafka-admin-client
request.timeout.ms=30000
default.api.timeout.ms=60000
