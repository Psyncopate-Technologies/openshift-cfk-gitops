apiVersion: platform.confluent.io/v1beta1
kind: KsqlDB
metadata:
  name: ksqldb
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-ksqldb-server:8.1.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 10Gi
  podTemplate:
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
  tls:
    autoGeneratedCerts: true
  externalAccess:
    type: route
    route:
      domain: dev.confluent.psyncopate.io
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
  configOverrides:
    server:
      - ksql.streams.replication.factor=3
      - ksql.internal.topic.replicas=3
