apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center-next-gen:2.3.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 10Gi
  podTemplate:
    resources:
      requests:
        cpu: "500m"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 4Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
  authorization:
    type: rbac
  tls:
    autoGeneratedCerts: true
  externalAccess:
    type: route
    route:
      domain: dev.confluent.psyncopate.io
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-jass
        oauthSettings:
          audience: api://confluent
          expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
          groupsClaimName: groups
          subClaimName: sub
          jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
          tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
          scope: confluent
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
    connect:
      - name: connect
        url: https://connect.confluent.svc.cluster.local:8083
        tls:
          enabled: true
    ksqldb:
      - name: ksqldb
        url: https://ksqldb.confluent.svc.cluster.local:8088
        tls:
          enabled: true
    mds:
      endpoint: https://kafka.confluent.svc.cluster.local:8090
      tls:
        enabled: true
      ssoProtocol: oidc
      tokenKeyPair:
        secretRef: mds-token
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-jass
          configuration:
            audience: api://confluent
            expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
            groupsClaimName: groups
            subClaimName: sub
            jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
            tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
            scope: confluent
  configOverrides:
    server:
      - confluent.controlcenter.internal.topics.replication=3
      - confluent.controlcenter.command.topic.replication=3
      - confluent.metrics.topic.replication=3
      - confluent.controlcenter.ui.autoupdate.enable=true
