apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:8.1.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 10Gi
  podTemplate:
    resources:
      requests:
        cpu: "500m"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 4Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kraftcontroller
              topologyKey: topology.kubernetes.io/zone
  authorization:
    type: rbac
    superUsers:
      - User:0oayz08eewEWBFnjU697
  tls:
    autoGeneratedCerts: true
  listeners:
    controller:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-jass
        oauthSettings:
          audience: api://confluent
          expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
          groupsClaimName: groups
          subClaimName: sub
          jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
          tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
          scope: confluent
      tls:
        enabled: true
  configOverrides:
    server:
      - controller.quorum.election.timeout.ms=5000
      - controller.quorum.fetch.timeout.ms=5000
      - default.replication.factor=3
