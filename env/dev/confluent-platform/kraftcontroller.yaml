apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:8.1.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 10Gi
  podTemplate:
    resources:
      requests:
        cpu: "500m"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 4Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kraftcontroller
              topologyKey: topology.kubernetes.io/zone
  tls:
    autoGeneratedCerts: true
  listeners:
    controller:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: kraft-oauth-secret
        oauthSettings:
          groupsClaimName: groups
          subClaimName: sub
          audience: api://690a35c6-9aa6-4acb-b34d-bc805e222067
          expectedIssuer: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/v2.0
          jwksEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/discovery/v2.0/keys
          tokenEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
          scope: api://690a35c6-9aa6-4acb-b34d-bc805e222067/.default
      tls:
        enabled: true
  configOverrides:
    server:
      - controller.quorum.election.timeout.ms=5000
      - controller.quorum.fetch.timeout.ms=5000
