apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:8.1.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret
  mountedVolumes:
    volumes:
      - name: oauth-truststore
        secret:
          secretName: oauth-truststore
    volumeMounts:
      - name: oauth-truststore
        mountPath: /mnt/oauth-truststore
  podTemplate:
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
  authorization:
    type: rbac
  tls:
    secretRef: tls-certs
  externalAccess:
    type: route
    route:
      domain: dev.confluent.psyncopate.io
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-jass
        oauthSettings:
          audience: api://confluent
          expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
          groupsClaimName: groups
          subClaimName: sub
          jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
          tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
          scope: confluent
      tls:
        enabled: true
        secretRef: tls-certs
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
        secretRef: tls-certs
    mds:
      endpoint: https://kafka.confluent.svc.cluster.local:8090
      tls:
        enabled: true
        secretRef: tls-certs
      tokenKeyPair:
        secretRef: mds-token
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-jass
          configuration:
            audience: api://confluent
            expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
            groupsClaimName: groups
            subClaimName: sub
            jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
            tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
            scope: confluent
  configOverrides:
    server:
      - config.storage.replication.factor=3
      - offset.storage.replication.factor=3
      - status.storage.replication.factor=3
      - connector.client.config.override.policy=All
    jvm:
      - "-Djavax.net.ssl.trustStoreType=JKS"
      - "-Djavax.net.ssl.trustStore=/mnt/oauth-truststore/truststore.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
