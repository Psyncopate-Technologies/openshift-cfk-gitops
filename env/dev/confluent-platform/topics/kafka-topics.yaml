apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: orders-topic
  namespace: confluent
spec:
  kafkaRestClassRef:
    name: default
    namespace: confluent
  partitions: 6
  replicas: 3
  configs:
    cleanup.policy: delete
    retention.ms: "604800000"   # 7 days
    min.insync.replicas: "2"
    segment.bytes: "1073741824" # 1 GB