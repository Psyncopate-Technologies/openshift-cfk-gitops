apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:8.1.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 50Gi
  podTemplate:
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kafka
              topologyKey: topology.kubernetes.io/zone
  tls:
    autoGeneratedCerts: true
  listeners:
    internal:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: kafka-oauth-secret
        oauthSettings:
          groupsClaimName: groups
          subClaimName: sub
          audience: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae
          expectedIssuer: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/v2.0
          jwksEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/discovery/v2.0/keys
          tokenEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
          scope: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae/.default
      tls:
        enabled: true
    external:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: kafka-oauth-secret
        oauthSettings:
          groupsClaimName: groups
          subClaimName: sub
          audience: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae
          expectedIssuer: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/v2.0
          jwksEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/discovery/v2.0/keys
          tokenEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
          scope: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae/.default
      tls:
        enabled: true
      externalAccess:
        type: route
        route:
          domain: dev.confluent.psyncopate.io
  authorization:
    type: rbac
    superUsers:
      # Kafka service principal (os-cfk-kafka)
      - User:2641e4ad-54c1-4ffe-a1ef-b9e94a2808e4
      # KRaft controller service principal (os-cfk-kraft)
      - User:d4eafd95-bfbf-4060-a786-441cda1296e8
      # Control Center service principal (os-cfk-c3)
      - User:41f7a3da-aadc-4fc6-bad1-dfff5cecab12
      # Schema Registry service principal (os-cfk-schema-registry)
      - User:74cba9d7-2a5b-4298-9fb1-9cb14904fd74
      # Connect service principal (os-cfk-connect)
      - User:ebbff410-7405-4225-adfd-86cefd80c11d
      # KsqlDB service principal (os-cfk-ksqldb)
      - User:a9e531d9-77b4-45e6-9945-da021c5717a6
      # REST Proxy service principal (os-cfk-rest-proxy)
      - User:fda30284-8bd4-4353-a8a0-ff05127d420e
  services:
    mds:
      authentication:
        type: bearer
      tls:
        enabled: true
      tokenKeyPair:
        secretRef: mds-token
      provider:
        sso:
          clientCredentials:
            secretRef: kafka-oauth-secret-oidc
          configurations:
            audience: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae
            authorizeBaseEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/authorize
            groupsClaimName: groups
            issuer: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/v2.0
            jwksEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/discovery/v2.0/keys
            refreshToken: true
            tokenBaseEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
            sessionMaxTimeout: 21600000
            sessionTokenExpiry: 900000
        oauth:
          configurations:
            groupsClaimName: groups
            subClaimName: sub
            audience: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae
            expectedIssuer: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/v2.0
            jwksEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/discovery/v2.0/keys
            tokenEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
            scope: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae/.default
      impersonation:
        admins:
          # REST Proxy service principal (for impersonation)
          - User:fda30284-8bd4-4353-a8a0-ff05127d420e
          # Kafka service principal
          - User:2641e4ad-54c1-4ffe-a1ef-b9e94a2808e4
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        tls:
          enabled: true
        authentication:
          type: oauth
          jaasConfig:
            secretRef: kafka-oauth-secret
          oauthSettings:
            groupsClaimName: groups
            subClaimName: sub
            audience: api://690a35c6-9aa6-4acb-b34d-bc805e222067
            expectedIssuer: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/v2.0
            jwksEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/discovery/v2.0/keys
            tokenEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
            scope: api://690a35c6-9aa6-4acb-b34d-bc805e222067/.default
    kafkaRest:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: kafka-oauth-secret
        oauthSettings:
          groupsClaimName: groups
          subClaimName: sub
          audience: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae
          expectedIssuer: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/v2.0
          jwksEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/discovery/v2.0/keys
          tokenEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
          scope: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae/.default
      tls:
        enabled: true
  metricReporter:
    enabled: true
    bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    tls:
      enabled: true
    authentication:
      type: oauth
      jaasConfig:
        secretRef: kafka-oauth-secret
      oauthSettings:
        groupsClaimName: groups
        subClaimName: sub
        audience: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae
        expectedIssuer: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/v2.0
        jwksEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/discovery/v2.0/keys
        tokenEndpointUri: https://login.microsoftonline.com/1b9dca15-4db4-4905-8725-d318d11c6875/oauth2/v2.0/token
        scope: api://b10fe602-4b8f-4e9f-bcd9-15eb961e7fae/.default
  configOverrides:
    server:
      - auto.create.topics.enable=false
      - default.replication.factor=3
      - min.insync.replicas=2
      - num.partitions=3
      - log.retention.hours=168
      - listener.name.internal.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="thePrincipalName" publicKeyPath="/mnt/secrets/mds-token/mdsPublicKey.pem";
      - listener.name.external.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="thePrincipalName" publicKeyPath="/mnt/secrets/mds-token/mdsPublicKey.pem";
