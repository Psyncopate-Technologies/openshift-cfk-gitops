apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3

  image:
    application: confluentinc/cp-server:8.1.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret

  dataVolumeCapacity: 50Gi

  mountedVolumes:
    volumes:
      - name: oauth-truststore
        secret:
          secretName: oauth-truststore
    volumeMounts:
      - name: oauth-truststore
        mountPath: /mnt/oauth-truststore

  podTemplate:
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kafka
              topologyKey: topology.kubernetes.io/zone

  authorization:
    type: rbac
    superUsers:
      - User:0oayz08eewEWBFnjU697

  tls:
    secretRef: tls-certs

  listeners:
    internal:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-jass
        oauthSettings:
          audience: api://confluent
          expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
          groupsClaimName: groups
          subClaimName: sub
          jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
          tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
          scope: confluent
      tls:
        enabled: true

    external:
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-jass
        oauthSettings:
          audience: api://confluent
          expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
          groupsClaimName: groups
          subClaimName: sub
          jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
          tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
          scope: confluent
      tls:
        enabled: true
      externalAccess:
        type: route
        route:
          domain: dev.confluent.psyncopate.io

  services:
    mds:
      tls:
        enabled: true
      tokenKeyPair:
        secretRef: mds-token
      provider:
        oauth:
          configurations:
            audience: api://confluent
            expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
            groupsClaimName: groups
            subClaimName: sub
            jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
            scope: confluent
        sso:
          clientCredentials:
            secretRef: oauth-jass-oidc
          configurations:
            issuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
            audience: api://confluent
            authorizeBaseEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/authorize
            tokenBaseEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
            jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
            groupsClaimName: groups
            subClaimName: email
            groupsClaimScope: openid profile email
            refreshToken: true

  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: oauth
          jaasConfig:
            secretRef: oauth-jass
          oauthSettings:
            audience: api://confluent
            expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
            groupsClaimName: groups
            subClaimName: sub
            jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
            tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
            scope: confluent
        tls:
          enabled: true
          secretRef: tls-certs

  metricReporter:
    enabled: true
    bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    tls:
      enabled: true
      secretRef: tls-certs
    authentication:
      type: oauth
      jaasConfig:
        secretRef: oauth-jass
      oauthSettings:
        audience: api://confluent
        expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
        groupsClaimName: groups
        subClaimName: sub
        jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
        tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
        scope: kafka   # ← FIXED

  configOverrides:
    server:
      - auto.create.topics.enable=false
      - default.replication.factor=3
      - min.insync.replicas=2
      - num.partitions=3
      - log.retention.hours=168

      # ---- Broker internal clients ----
      - security.protocol=SASL_SSL
      - sasl.mechanism=OAUTHBEARER
      - sasl.oauthbearer.token.endpoint.url=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
      - sasl.oauthbearer.jwks.endpoint.url=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
      - sasl.oauthbearer.expected.issuer=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
      - sasl.oauthbearer.scope=confluent

      # ---- Metrics Reporter ----
      - confluent.metrics.reporter.security.protocol=SASL_SSL
      - confluent.metrics.reporter.sasl.mechanism=OAUTHBEARER
      - confluent.metrics.reporter.sasl.oauthbearer.token.endpoint.url=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
      - confluent.metrics.reporter.sasl.oauthbearer.jwks.endpoint.url=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
      - confluent.metrics.reporter.sasl.oauthbearer.expected.issuer=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
      - confluent.metrics.reporter.sasl.oauthbearer.scope=kafka

      # ---- License client ----
      - confluent.license.security.protocol=SASL_SSL
      - confluent.license.sasl.mechanism=OAUTHBEARER
      - confluent.license.sasl.oauthbearer.token.endpoint.url=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
      - confluent.license.sasl.oauthbearer.jwks.endpoint.url=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
      - confluent.license.sasl.oauthbearer.expected.issuer=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
      - confluent.license.sasl.oauthbearer.scope=kafka

      # ---- Kafka REST security plugin ----
      - confluent.kafkarest.security.protocol=SASL_SSL
      - confluent.kafkarest.sasl.mechanism=OAUTHBEARER
      - confluent.kafkarest.sasl.oauthbearer.token.endpoint.url=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
      - confluent.kafkarest.sasl.oauthbearer.jwks.endpoint.url=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
      - confluent.kafkarest.sasl.oauthbearer.expected.issuer=https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
      - confluent.kafkarest.sasl.oauthbearer.scope=kafka

    jvm:
      - "-Djavax.net.ssl.trustStoreType=JKS"
      - "-Djavax.net.ssl.trustStore=/mnt/oauth-truststore/truststore.jks"
      - "-Djavax.net.ssl.trustStorePassword=changeit"
