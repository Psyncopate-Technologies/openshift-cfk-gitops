apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:8.1.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret
  dataVolumeCapacity: 50Gi
  podTemplate:
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kafka
              topologyKey: topology.kubernetes.io/zone
  configOverrides:
    server:
      - auto.create.topics.enable=false
      - default.replication.factor=3
      - min.insync.replicas=2
      - num.partitions=3
      - log.retention.hours=168
  tls:
    autoGeneratedCerts: true
    sanDnsNames:
      - "*.dev.confluent.psyncopate.io"
  listeners:
    internal:
      tls:
        enabled: true
    external:
      tls:
        enabled: true
      externalAccess:
        type: route
        route:
          domain: dev.confluent.psyncopate.io
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
  metricReporter:
    enabled: true
    bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    tls:
      enabled: true
