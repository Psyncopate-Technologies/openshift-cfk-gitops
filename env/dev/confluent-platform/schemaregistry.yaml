apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  license:
    secretRef: confluent-license
  image:
    application: confluentinc/cp-schema-registry:8.1.1
    init: confluentinc/confluent-init-container:3.1.1
    pullSecretRef:
      - dockerhub-secret
  podTemplate:
    resources:
      requests:
        cpu: "250m"
        memory: 512Mi
      limits:
        cpu: "500m"
        memory: 1Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
  authorization:
    type: rbac
  tls:
    secretRef: tls-certs
  externalAccess:
    type: route
    route:
      domain: dev.confluent.psyncopate.io
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: oauth
        jaasConfig:
          secretRef: oauth-jass
        oauthSettings:
          audience: api://confluent
          expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
          groupsClaimName: groups
          subClaimName: sub
          jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
          tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
          scope: confluent
      tls:
        enabled: true
        secretRef: tls-certs
    mds:
      endpoint: https://kafka.confluent.svc.cluster.local:8090
      tls:
        enabled: true
        secretRef: tls-certs
      tokenKeyPair:
        secretRef: mds-token
      authentication:
        type: oauth
        oauth:
          secretRef: oauth-jass
          configuration:
            audience: api://confluent
            expectedIssuer: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697
            groupsClaimName: groups
            subClaimName: sub
            jwksEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/keys
            tokenEndpointUri: https://integrator-9299379.okta.com/oauth2/ausycetmnaDzitHrI697/v1/token
            scope: confluent
