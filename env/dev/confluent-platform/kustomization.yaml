apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: confluent

resources:
  # TLS Certificates
  - secrets/tls-certs.yaml
  # OAuth Secrets
  - secrets/oauth-jass.yaml
  - secrets/oauth-jass-oidc.yaml
  - secrets/mds-token.yaml
  - secrets/oauth-truststore.yaml
  # License
  - secrets/confluent-license.yaml
  # RBAC
  - rbac/kafkarestclass.yaml
  - rbac/sysAdmins.yaml
  # Topics
  - topics/kafka-topics.yaml
  # Confluent Platform Components
  - kraftcontroller.yaml
  - kafka.yaml
  - schemaregistry.yaml
  - connect.yaml
  - ksqldb.yaml
  - controlcenter.yaml
  - kafka-rest-proxy.yaml
