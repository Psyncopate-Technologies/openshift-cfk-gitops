name: 05-Deploy Confluent Platform

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'ROSA cluster name'
        required: true
        type: choice
        default: 'cfk-dev'
        options:
          - cfk-dev
          - cfk-stg
          - cfk-prd
          - cfk-dr

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Confluent Platform via ArgoCD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install ROSA CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/rosa/latest/rosa-linux.tar.gz
          tar -xzf rosa-linux.tar.gz
          sudo mv rosa /usr/local/bin/

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Login to ROSA
        run: |
          rosa login --token="${{ secrets.RHCS_TOKEN }}"

      - name: Get Cluster Info
        id: cluster
        run: |
          rosa describe cluster --cluster="${{ github.event.inputs.cluster_name }}" --output json > cluster-info.json

          API_URL=$(jq -r '.api.url' cluster-info.json)
          DOMAIN=$(jq -r '.dns.base_domain' cluster-info.json)

          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "apps_domain=apps.${DOMAIN}" >> $GITHUB_OUTPUT

          # Determine custom domain based on cluster name
          case "${{ github.event.inputs.cluster_name }}" in
            cfk-dev) CUSTOM_DOMAIN="dev.confluent.psyncopate.io" ;;
            cfk-stg) CUSTOM_DOMAIN="stg.confluent.psyncopate.io" ;;
            cfk-prd) CUSTOM_DOMAIN="prd.confluent.psyncopate.io" ;;
            cfk-dr)  CUSTOM_DOMAIN="dr.confluent.psyncopate.io" ;;
            *)       CUSTOM_DOMAIN="dev.confluent.psyncopate.io" ;;
          esac
          echo "custom_domain=${CUSTOM_DOMAIN}" >> $GITHUB_OUTPUT

      - name: Login to OpenShift
        run: |
          oc login "${{ steps.cluster.outputs.api_url }}" \
            --username=cluster-admin \
            --password="${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            --insecure-skip-tls-verify=true

      - name: Verify CFK Operator is Running
        run: |
          echo "Checking if CFK Operator is running..."
          if ! oc get deployment confluent-operator -n confluent-operator -o name 2>/dev/null | grep -q deployment; then
            echo "ERROR: CFK Operator is not deployed. Please run '04-Deploy CFK Operator' first."
            exit 1
          fi

          echo "CFK Operator is running:"
          oc get pods -n confluent-operator -l app.kubernetes.io/name=confluent-for-kubernetes

      - name: Deploy AppProject
        run: |
          # Update namespace in appproject if needed and apply
          sed 's/namespace: argocd/namespace: openshift-gitops/g' env/dev/argocd/appproject.yaml | oc apply -f -

      - name: Deploy Confluent Platform Application
        run: |
          echo "Deploying Confluent Platform via ArgoCD..."
          # Update namespace in application if needed and apply
          sed 's/namespace: argocd/namespace: openshift-gitops/g' env/dev/argocd/confluent-platform-app.yaml | oc apply -f -

          echo "Waiting for initial sync..."
          sleep 30

          # Wait for sync
          for i in {1..30}; do
            STATUS=$(oc get application confluent-platform -n openshift-gitops -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH=$(oc get application confluent-platform -n openshift-gitops -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
            echo "Confluent Platform - Sync: $STATUS, Health: $HEALTH (attempt $i/30)"
            if [ "$STATUS" == "Synced" ]; then
              echo "Confluent Platform is synced!"
              break
            fi
            sleep 20
          done

      - name: Verify Confluent Platform Components
        run: |
          echo "=== Confluent Platform Pods ==="
          oc get pods -n confluent
          echo ""
          echo "=== ArgoCD Application Status ==="
          oc get application confluent-platform -n openshift-gitops -o wide

      - name: Generate Summary
        run: |
          CUSTOM_DOMAIN="${{ steps.cluster.outputs.custom_domain }}"
          ARGOCD_URL=$(oc get route openshift-gitops-server -n openshift-gitops -o jsonpath='{.spec.host}' 2>/dev/null || echo "N/A")

          echo "## Confluent Platform Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ github.event.inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**ArgoCD UI:** https://${ARGOCD_URL}" >> $GITHUB_STEP_SUMMARY
          echo "**Custom Domain:** ${CUSTOM_DOMAIN}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Application Status" >> $GITHUB_STEP_SUMMARY
          echo "| Application | Sync Status | Health |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------------|--------|" >> $GITHUB_STEP_SUMMARY

          SYNC=$(oc get application confluent-platform -n openshift-gitops -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "N/A")
          HEALTH=$(oc get application confluent-platform -n openshift-gitops -o jsonpath='{.status.health.status}' 2>/dev/null || echo "N/A")
          echo "| confluent-platform | ${SYNC} | ${HEALTH} |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitOps Benefits" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-sync:** Changes pushed to git are automatically deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Self-heal:** Drift from desired state is automatically corrected" >> $GITHUB_STEP_SUMMARY
          echo "- **Prune:** Removed resources are automatically deleted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access URLs (once DNS is configured)" >> $GITHUB_STEP_SUMMARY
          echo "| Component | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| ArgoCD | https://${ARGOCD_URL} |" >> $GITHUB_STEP_SUMMARY
          echo "| Control Center | https://controlcenter.${CUSTOM_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Registry | https://schemaregistry.${CUSTOM_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| Connect | https://connect.${CUSTOM_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| ksqlDB | https://ksqldb.${CUSTOM_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| REST Proxy | https://kafkarestproxy.${CUSTOM_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DNS Setup Required" >> $GITHUB_STEP_SUMMARY
          echo "Create a wildcard CNAME record in your DNS:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "*.${CUSTOM_DOMAIN} -> *.apps.${{ steps.cluster.outputs.apps_domain }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
