name: 03-Install ArgoCD

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'ROSA cluster name'
        required: true
        default: 'cfk-dev'

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  install:
    name: Install ArgoCD (OpenShift GitOps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install ROSA CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/rosa/latest/rosa-linux.tar.gz
          tar -xzf rosa-linux.tar.gz
          sudo mv rosa /usr/local/bin/

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Login to ROSA
        run: |
          rosa login --token="${{ secrets.RHCS_TOKEN }}"

      - name: Get Cluster Info
        id: cluster
        run: |
          rosa describe cluster --cluster="${{ github.event.inputs.cluster_name }}" --output json > cluster-info.json

          API_URL=$(jq -r '.api.url' cluster-info.json)
          DOMAIN=$(jq -r '.dns.base_domain' cluster-info.json)

          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "apps_domain=apps.${DOMAIN}" >> $GITHUB_OUTPUT

      - name: Login to OpenShift
        run: |
          oc login "${{ steps.cluster.outputs.api_url }}" \
            --username=cluster-admin \
            --password="${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            --insecure-skip-tls-verify=true

      - name: Install OpenShift GitOps Operator
        run: |
          cat <<EOF | oc apply -f -
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-gitops-operator
            namespace: openshift-operators
          spec:
            channel: latest
            installPlanApproval: Automatic
            name: openshift-gitops-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
          EOF

      - name: Wait for Operator Installation
        run: |
          echo "Waiting for OpenShift GitOps operator to be installed..."

          # Wait for the CSV to be created and succeed
          for i in {1..60}; do
            CSV=$(oc get csv -n openshift-operators -o name 2>/dev/null | grep gitops || true)
            if [ -n "$CSV" ]; then
              PHASE=$(oc get $CSV -n openshift-operators -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
              if [ "$PHASE" = "Succeeded" ]; then
                echo "OpenShift GitOps operator installed successfully"
                break
              fi
            fi
            echo "Waiting for operator... (attempt $i/60)"
            sleep 10
          done

      - name: Wait for ArgoCD Instance
        run: |
          echo "Waiting for default ArgoCD instance in openshift-gitops namespace..."

          # Wait for the namespace to be created
          for i in {1..30}; do
            if oc get namespace openshift-gitops &>/dev/null; then
              echo "Namespace openshift-gitops exists"
              break
            fi
            echo "Waiting for namespace... (attempt $i/30)"
            sleep 10
          done

          # Wait for ArgoCD server deployment
          for i in {1..60}; do
            if oc get deployment openshift-gitops-server -n openshift-gitops &>/dev/null; then
              echo "ArgoCD server deployment found, waiting for availability..."
              oc wait --for=condition=Available deployment/openshift-gitops-server -n openshift-gitops --timeout=300s
              break
            fi
            echo "Waiting for ArgoCD deployment... (attempt $i/60)"
            sleep 10
          done

      - name: Create Custom Domain Route for ArgoCD
        run: |
          # Determine custom domain based on cluster name
          case "${{ github.event.inputs.cluster_name }}" in
            cfk-dev) CUSTOM_DOMAIN="dev.confluent.psyncopate.io" ;;
            cfk-stg) CUSTOM_DOMAIN="stg.confluent.psyncopate.io" ;;
            cfk-prd) CUSTOM_DOMAIN="prd.confluent.psyncopate.io" ;;
            cfk-dr)  CUSTOM_DOMAIN="dr.confluent.psyncopate.io" ;;
            *)       CUSTOM_DOMAIN="dev.confluent.psyncopate.io" ;;
          esac

          echo "Creating ArgoCD route for argocd.${CUSTOM_DOMAIN}"

          cat <<EOF | oc apply -f -
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: argocd-custom
            namespace: openshift-gitops
          spec:
            host: argocd.${CUSTOM_DOMAIN}
            to:
              kind: Service
              name: openshift-gitops-server
            port:
              targetPort: https
            tls:
              termination: passthrough
              insecureEdgeTerminationPolicy: Redirect
          EOF

      - name: Get ArgoCD Admin Password
        id: argocd
        run: |
          # Get the admin password from the secret
          ARGOCD_PASSWORD=$(oc get secret openshift-gitops-cluster -n openshift-gitops -o jsonpath='{.data.admin\.password}' | base64 -d)
          echo "::add-mask::${ARGOCD_PASSWORD}"
          echo "password=${ARGOCD_PASSWORD}" >> $GITHUB_OUTPUT

          # Get the default ArgoCD URL
          ARGOCD_URL=$(oc get route openshift-gitops-server -n openshift-gitops -o jsonpath='{.spec.host}')
          echo "url=${ARGOCD_URL}" >> $GITHUB_OUTPUT

          # Get the custom domain URL
          ARGOCD_CUSTOM_URL=$(oc get route argocd-custom -n openshift-gitops -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
          echo "custom_url=${ARGOCD_CUSTOM_URL}" >> $GITHUB_OUTPUT

      - name: Verify Installation
        run: |
          echo "=== ArgoCD Status ==="
          oc get pods -n openshift-gitops
          echo ""
          echo "=== ArgoCD Route ==="
          oc get route -n openshift-gitops

      - name: Generate Summary
        run: |
          echo "## ArgoCD Installation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ github.event.inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access Information" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Custom Domain URL | https://${{ steps.argocd.outputs.custom_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Default URL | https://${{ steps.argocd.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Username | admin |" >> $GITHUB_STEP_SUMMARY
          echo "| Password | (see workflow logs or get from secret) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Get Password" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "oc get secret openshift-gitops-cluster -n openshift-gitops -o jsonpath='{.data.admin\.password}' | base64 -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Access ArgoCD UI at the Custom Domain URL above" >> $GITHUB_STEP_SUMMARY
          echo "2. Run **04-Deploy CFK Operator** to deploy the operator via GitOps" >> $GITHUB_STEP_SUMMARY
