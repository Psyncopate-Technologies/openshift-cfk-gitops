name: 07-Deploy cert-manager

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      acme_server:
        description: 'ACME server'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

env:
  AWS_REGION: us-east-1
  CERT_MANAGER_VERSION: "1.14.2"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy cert-manager
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs-${{ github.event.inputs.environment }}
          path: ./terraform-outputs

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Login to OpenShift
        run: |
          CLUSTER_API=$(jq -r '.cluster_api_url.value' terraform-outputs/terraform-outputs.json)
          oc login "$CLUSTER_API" \
            --username=cluster-admin \
            --password="${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            --insecure-skip-tls-verify=true

      - name: Get Terraform Outputs
        id: tf
        run: |
          CERT_MANAGER_ROLE=$(jq -r '.cert_manager_role_arn.value' terraform-outputs/terraform-outputs.json)
          ROUTE53_ZONE_ID=$(jq -r '.route53_zone_id.value' terraform-outputs/terraform-outputs.json)
          DOMAIN_NAME=$(jq -r '.route53_domain.value' terraform-outputs/terraform-outputs.json)

          echo "cert_manager_role=${CERT_MANAGER_ROLE}" >> $GITHUB_OUTPUT
          echo "route53_zone_id=${ROUTE53_ZONE_ID}" >> $GITHUB_OUTPUT
          echo "domain_name=${DOMAIN_NAME}" >> $GITHUB_OUTPUT

      - name: Add Jetstack Helm repository
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Deploy cert-manager
        run: |
          CERT_MANAGER_ROLE="${{ steps.tf.outputs.cert_manager_role }}"

          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --version "v${{ env.CERT_MANAGER_VERSION }}" \
            --set installCRDs=true \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="${CERT_MANAGER_ROLE}" \
            --set securityContext.runAsNonRoot=true \
            --set webhook.securityContext.runAsNonRoot=true \
            --set cainjector.securityContext.runAsNonRoot=true \
            --wait \
            --timeout 10m

      - name: Determine ACME Server URL
        id: acme
        run: |
          if [ "${{ github.event.inputs.acme_server }}" == "production" ]; then
            echo "server=https://acme-v02.api.letsencrypt.org/directory" >> $GITHUB_OUTPUT
            echo "issuer_name=letsencrypt-prod" >> $GITHUB_OUTPUT
          else
            echo "server=https://acme-staging-v02.api.letsencrypt.org/directory" >> $GITHUB_OUTPUT
            echo "issuer_name=letsencrypt-staging" >> $GITHUB_OUTPUT
          fi

      - name: Create ClusterIssuer for Let's Encrypt
        run: |
          ACME_SERVER="${{ steps.acme.outputs.server }}"
          ISSUER_NAME="${{ steps.acme.outputs.issuer_name }}"
          ROUTE53_ZONE_ID="${{ steps.tf.outputs.route53_zone_id }}"
          DOMAIN_NAME="${{ steps.tf.outputs.domain_name }}"

          oc apply -f - <<EOF
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: ${ISSUER_NAME}
          spec:
            acme:
              server: ${ACME_SERVER}
              email: ${{ secrets.ACME_EMAIL }}
              privateKeySecretRef:
                name: ${ISSUER_NAME}-account-key
              solvers:
                - dns01:
                    route53:
                      region: ${{ env.AWS_REGION }}
                      hostedZoneID: ${ROUTE53_ZONE_ID}
                  selector:
                    dnsZones:
                      - "${DOMAIN_NAME}"
          EOF

      - name: Create Wildcard Certificate
        run: |
          ISSUER_NAME="${{ steps.acme.outputs.issuer_name }}"
          DOMAIN_NAME="${{ steps.tf.outputs.domain_name }}"
          ENV="${{ github.event.inputs.environment }}"

          oc apply -f - <<EOF
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: wildcard-tls
            namespace: confluent
          spec:
            secretName: wildcard-tls
            issuerRef:
              name: ${ISSUER_NAME}
              kind: ClusterIssuer
            commonName: "*.apps.${ENV}.${DOMAIN_NAME}"
            dnsNames:
              - "*.apps.${ENV}.${DOMAIN_NAME}"
              - "apps.${ENV}.${DOMAIN_NAME}"
            privateKey:
              algorithm: RSA
              size: 2048
          EOF

      - name: Wait for Certificate to be Ready
        run: |
          echo "Waiting for wildcard certificate to be issued..."
          for i in {1..30}; do
            STATUS=$(oc get certificate wildcard-tls -n confluent -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
            if [ "$STATUS" == "True" ]; then
              echo "Certificate is ready!"
              break
            fi
            echo "Certificate status: $STATUS (attempt $i/30)"
            sleep 30
          done

          # Show certificate status
          oc describe certificate wildcard-tls -n confluent

      - name: Verify cert-manager Deployment
        run: |
          echo "cert-manager pods:"
          oc get pods -n cert-manager

          echo ""
          echo "ClusterIssuers:"
          oc get clusterissuers

          echo ""
          echo "Certificates:"
          oc get certificates -A

      - name: Generate Summary
        run: |
          echo "## cert-manager Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**cert-manager Version:** ${{ env.CERT_MANAGER_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**ACME Server:** ${{ github.event.inputs.acme_server }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ClusterIssuer" >> $GITHUB_STEP_SUMMARY
          echo "- Name: ${{ steps.acme.outputs.issuer_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Route53 Zone: ${{ steps.tf.outputs.route53_zone_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Certificates" >> $GITHUB_STEP_SUMMARY
          echo "- wildcard-tls (confluent namespace)" >> $GITHUB_STEP_SUMMARY
