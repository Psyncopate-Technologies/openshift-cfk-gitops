name: 04-Deploy Confluent Platform

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'ROSA cluster name'
        required: true
        default: 'cfk-test'

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Confluent Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install ROSA CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/rosa/latest/rosa-linux.tar.gz
          tar -xzf rosa-linux.tar.gz
          sudo mv rosa /usr/local/bin/

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Login to ROSA
        run: |
          rosa login --token="${{ secrets.RHCS_TOKEN }}"

      - name: Get Cluster Info
        id: cluster
        run: |
          rosa describe cluster --cluster="${{ github.event.inputs.cluster_name }}" --output json > cluster-info.json

          API_URL=$(jq -r '.api.url' cluster-info.json)
          DOMAIN=$(jq -r '.dns.base_domain' cluster-info.json)

          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "apps_domain=apps.${DOMAIN}" >> $GITHUB_OUTPUT

          echo "Cluster API: $API_URL"
          echo "Apps Domain: apps.${DOMAIN}"

      - name: Login to OpenShift
        run: |
          oc login "${{ steps.cluster.outputs.api_url }}" \
            --username=cluster-admin \
            --password="${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            --insecure-skip-tls-verify=true

      - name: Update Manifests with Cluster Domain
        run: |
          APPS_DOMAIN="${{ steps.cluster.outputs.apps_domain }}"

          # Update Kafka manifest with correct domain
          sed -i "s/apps\.rm2\.thpm\.p1\.openshiftapps\.com/${APPS_DOMAIN}/g" environments/dev/platform-dockerhub/*.yaml

          echo "Updated manifests with domain: ${APPS_DOMAIN}"

      - name: Deploy Confluent Platform
        run: |
          echo "Deploying Confluent Platform components..."
          oc apply -f environments/dev/platform-dockerhub/

      - name: Wait for KRaft Controller
        run: |
          echo "Waiting for KRaft Controller to be ready..."
          for i in {1..60}; do
            PHASE=$(oc get kraftcontroller kraftcontroller -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
            if [ "$PHASE" == "RUNNING" ]; then
              echo "KRaft Controller is running!"
              break
            fi
            echo "KRaft Controller phase: $PHASE (attempt $i/60)"
            sleep 30
          done

      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka to be ready..."
          for i in {1..60}; do
            PHASE=$(oc get kafka kafka -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
            if [ "$PHASE" == "RUNNING" ]; then
              echo "Kafka is running!"
              break
            fi
            echo "Kafka phase: $PHASE (attempt $i/60)"
            sleep 30
          done

      - name: Wait for Other Components
        run: |
          COMPONENTS="schemaregistry connect ksqldb controlcenter kafkarestproxy"

          for COMPONENT in $COMPONENTS; do
            echo "Waiting for $COMPONENT..."
            for i in {1..30}; do
              PHASE=$(oc get $COMPONENT $COMPONENT -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo "NotFound")
              if [ "$PHASE" == "RUNNING" ]; then
                echo "$COMPONENT is running!"
                break
              fi
              echo "$COMPONENT phase: $PHASE (attempt $i/30)"
              sleep 20
            done
          done

      - name: Verify Deployment
        run: |
          echo "=== Confluent Platform Status ==="
          echo ""
          oc get kraftcontroller,kafka,schemaregistry,connect,ksqldb,controlcenter,kafkarestproxy -n confluent
          echo ""
          echo "Pods:"
          oc get pods -n confluent
          echo ""
          echo "Routes:"
          oc get routes -n confluent 2>/dev/null || echo "No routes created yet"

      - name: Generate Summary
        run: |
          APPS_DOMAIN="${{ steps.cluster.outputs.apps_domain }}"

          echo "## Confluent Platform Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ github.event.inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Apps Domain:** ${APPS_DOMAIN}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Component Status" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Phase |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| KRaft Controller | $(oc get kraftcontroller kraftcontroller -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| Kafka | $(oc get kafka kafka -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Registry | $(oc get schemaregistry schemaregistry -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| Connect | $(oc get connect connect -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| ksqlDB | $(oc get ksqldb ksqldb -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| Control Center | $(oc get controlcenter controlcenter -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "| REST Proxy | $(oc get kafkarestproxy kafkarestproxy -n confluent -o jsonpath='{.status.phase}' 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access URLs (once running)" >> $GITHUB_STEP_SUMMARY
          echo "| Component | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Control Center | https://controlcenter.${APPS_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Registry | https://schemaregistry.${APPS_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| Connect | https://connect.${APPS_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| ksqlDB | https://ksqldb.${APPS_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
          echo "| REST Proxy | https://kafkarestproxy.${APPS_DOMAIN} |" >> $GITHUB_STEP_SUMMARY
