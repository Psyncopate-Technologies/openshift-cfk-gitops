name: 03-Mirror Images to ECR (Optional)

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'ROSA cluster name'
        required: true
        default: 'cfk-test'
      confluent_platform_version:
        description: 'Confluent Platform version'
        required: true
        default: '7.7.1'
      cfk_operator_version:
        description: 'CFK Operator version'
        required: true
        default: '2.10.0'

env:
  AWS_REGION: us-east-1
  DOCKER_HUB_REPO: docker.io/confluentinc

permissions:
  id-token: write
  contents: read

jobs:
  mirror:
    name: Mirror Confluent Images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "ecr_registry=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Create ECR Repositories
        run: |
          REPOS="cp-server cp-schema-registry cp-kafka-connect cp-ksqldb-server cp-control-center cp-kafka-rest confluent-init-container confluent-operator"

          for REPO in $REPOS; do
            echo "Creating ECR repository: confluent/${REPO}"
            aws ecr create-repository \
              --repository-name "confluent/${REPO}" \
              --image-scanning-configuration scanOnPush=true \
              2>/dev/null || echo "Repository already exists"
          done

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ steps.aws.outputs.ecr_registry }}

      - name: Login to Docker Hub (optional - for rate limits)
        if: ${{ secrets.DOCKER_HUB_USERNAME != '' }}
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | \
            docker login --username "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
        continue-on-error: true

      - name: Mirror Confluent Platform Images
        run: |
          ECR_REGISTRY="${{ steps.aws.outputs.ecr_registry }}"
          CP_VERSION="${{ github.event.inputs.confluent_platform_version }}"
          CFK_VERSION="${{ github.event.inputs.cfk_operator_version }}"

          # Define images to mirror
          declare -A IMAGES=(
            ["cp-server"]="${CP_VERSION}"
            ["cp-schema-registry"]="${CP_VERSION}"
            ["cp-kafka-connect"]="${CP_VERSION}"
            ["cp-ksqldb-server"]="${CP_VERSION}"
            ["cp-control-center"]="${CP_VERSION}"
            ["cp-kafka-rest"]="${CP_VERSION}"
            ["confluent-init-container"]="${CFK_VERSION}"
            ["confluent-operator"]="${CFK_VERSION}"
          )

          # Mirror each image
          for IMAGE in "${!IMAGES[@]}"; do
            VERSION="${IMAGES[$IMAGE]}"
            SOURCE="${DOCKER_HUB_REPO}/${IMAGE}:${VERSION}"
            TARGET="${ECR_REGISTRY}/confluent/${IMAGE}:${VERSION}"

            echo "Mirroring ${SOURCE} -> ${TARGET}"

            # Pull from Docker Hub
            docker pull "${SOURCE}"

            # Tag for ECR
            docker tag "${SOURCE}" "${TARGET}"

            # Push to ECR
            docker push "${TARGET}"

            echo "Successfully mirrored ${IMAGE}:${VERSION}"
            echo ""
          done

      - name: Verify Images in ECR
        run: |
          ECR_REGISTRY="${{ steps.aws.outputs.ecr_registry }}"

          echo "Verifying images in ECR..."
          echo ""

          for REPO in cp-server cp-schema-registry cp-kafka-connect cp-ksqldb-server cp-control-center cp-kafka-rest confluent-init-container confluent-operator; do
            echo "Repository: confluent/${REPO}"
            aws ecr describe-images \
              --repository-name "confluent/${REPO}" \
              --query 'imageDetails[*].{Tags:imageTags,PushedAt:imagePushedAt}' \
              --output table 2>/dev/null || echo "  No images found"
            echo ""
          done

      - name: Generate Summary
        run: |
          echo "## Image Mirror Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ github.event.inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**ECR Registry:** ${{ steps.aws.outputs.ecr_registry }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mirrored Images" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| cp-server | ${{ github.event.inputs.confluent_platform_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cp-schema-registry | ${{ github.event.inputs.confluent_platform_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cp-kafka-connect | ${{ github.event.inputs.confluent_platform_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cp-ksqldb-server | ${{ github.event.inputs.confluent_platform_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cp-control-center | ${{ github.event.inputs.confluent_platform_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cp-kafka-rest | ${{ github.event.inputs.confluent_platform_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| confluent-init-container | ${{ github.event.inputs.cfk_operator_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| confluent-operator | ${{ github.event.inputs.cfk_operator_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note" >> $GITHUB_STEP_SUMMARY
          echo "This workflow is **optional**. The default setup uses Docker Hub images directly." >> $GITHUB_STEP_SUMMARY
          echo "Use this workflow only if you want to mirror images to your own ECR registry." >> $GITHUB_STEP_SUMMARY
