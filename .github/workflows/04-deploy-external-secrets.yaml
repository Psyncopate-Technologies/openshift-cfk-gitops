name: 04-Deploy External Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy External Secrets Operator
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs-${{ github.event.inputs.environment }}
          path: ./terraform-outputs

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Login to OpenShift
        run: |
          CLUSTER_API=$(jq -r '.cluster_api_url.value' terraform-outputs/terraform-outputs.json)
          oc login "$CLUSTER_API" \
            --username=cluster-admin \
            --password="${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            --insecure-skip-tls-verify=true

      - name: Add External Secrets Helm repo
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update

      - name: Deploy External Secrets Operator
        run: |
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set installCRDs=true \
            --set webhook.port=9443 \
            --set securityContext.runAsNonRoot=true \
            --wait \
            --timeout 10m

      - name: Get IAM Role ARN
        id: iam
        run: |
          ROLE_ARN=$(jq -r '.external_secrets_role_arn.value' terraform-outputs/terraform-outputs.json)
          echo "role_arn=${ROLE_ARN}" >> $GITHUB_OUTPUT

      - name: Deploy Service Account with IRSA
        run: |
          ROLE_ARN="${{ steps.iam.outputs.role_arn }}"

          # Create service account in confluent namespace
          oc apply -f - <<EOF
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: external-secrets-sa
            namespace: confluent
            annotations:
              eks.amazonaws.com/role-arn: "${ROLE_ARN}"
          EOF

      - name: Deploy ClusterSecretStore
        run: |
          AWS_REGION="${{ env.AWS_REGION }}"

          oc apply -f - <<EOF
          apiVersion: external-secrets.io/v1beta1
          kind: ClusterSecretStore
          metadata:
            name: aws-secrets-manager
          spec:
            provider:
              aws:
                service: SecretsManager
                region: ${AWS_REGION}
                auth:
                  jwt:
                    serviceAccountRef:
                      name: external-secrets-sa
                      namespace: confluent
          EOF

      - name: Deploy SecretStore in Confluent namespace
        run: |
          AWS_REGION="${{ env.AWS_REGION }}"

          oc apply -f - <<EOF
          apiVersion: external-secrets.io/v1beta1
          kind: SecretStore
          metadata:
            name: aws-secrets-manager
            namespace: confluent
          spec:
            provider:
              aws:
                service: SecretsManager
                region: ${AWS_REGION}
                auth:
                  jwt:
                    serviceAccountRef:
                      name: external-secrets-sa
          EOF

      - name: Deploy External Secrets for Confluent
        run: |
          ENV="${{ github.event.inputs.environment }}"

          oc apply -f - <<EOF
          apiVersion: external-secrets.io/v1beta1
          kind: ExternalSecret
          metadata:
            name: confluent-credentials
            namespace: confluent
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: aws-secrets-manager
              kind: SecretStore
            target:
              name: confluent-credentials
              creationPolicy: Owner
            data:
              - secretKey: kafka-admin-password
                remoteRef:
                  key: confluent/${ENV}/credentials
                  property: kafka_admin_password
              - secretKey: sr-password
                remoteRef:
                  key: confluent/${ENV}/credentials
                  property: schema_registry_password
              - secretKey: connect-password
                remoteRef:
                  key: confluent/${ENV}/credentials
                  property: connect_password
              - secretKey: ksqldb-password
                remoteRef:
                  key: confluent/${ENV}/credentials
                  property: ksqldb_password
              - secretKey: controlcenter-password
                remoteRef:
                  key: confluent/${ENV}/credentials
                  property: controlcenter_password
          ---
          apiVersion: external-secrets.io/v1beta1
          kind: ExternalSecret
          metadata:
            name: confluent-license
            namespace: confluent
          spec:
            refreshInterval: 24h
            secretStoreRef:
              name: aws-secrets-manager
              kind: SecretStore
            target:
              name: confluent-license
              creationPolicy: Owner
            data:
              - secretKey: license.txt
                remoteRef:
                  key: confluent/${ENV}/license
                  property: license
          EOF

      - name: Verify Deployment
        run: |
          echo "Verifying External Secrets Operator..."
          oc get pods -n external-secrets
          echo ""
          echo "SecretStores:"
          oc get secretstores -A
          echo ""
          echo "ClusterSecretStores:"
          oc get clustersecretstores
          echo ""
          echo "External Secrets:"
          oc get externalsecrets -n confluent

      - name: Generate Summary
        run: |
          echo "## External Secrets Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Components" >> $GITHUB_STEP_SUMMARY
          echo "- External Secrets Operator (via Helm)" >> $GITHUB_STEP_SUMMARY
          echo "- IRSA Service Account: external-secrets-sa" >> $GITHUB_STEP_SUMMARY
          echo "- ClusterSecretStore: aws-secrets-manager" >> $GITHUB_STEP_SUMMARY
          echo "- SecretStore: aws-secrets-manager (confluent namespace)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### External Secrets" >> $GITHUB_STEP_SUMMARY
          echo "- confluent-credentials" >> $GITHUB_STEP_SUMMARY
          echo "- confluent-license" >> $GITHUB_STEP_SUMMARY
