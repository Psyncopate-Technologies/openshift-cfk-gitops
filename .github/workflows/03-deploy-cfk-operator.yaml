name: 03-Deploy CFK Operator

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'ROSA cluster name'
        required: true
        default: 'cfk-test'
      cfk_version:
        description: 'CFK Operator Helm chart version'
        required: true
        default: '0.921.20'

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Confluent for Kubernetes Operator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install ROSA CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/rosa/latest/rosa-linux.tar.gz
          tar -xzf rosa-linux.tar.gz
          sudo mv rosa /usr/local/bin/

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Login to ROSA
        run: |
          rosa login --token="${{ secrets.RHCS_TOKEN }}"

      - name: Get Cluster Info
        id: cluster
        run: |
          rosa describe cluster --cluster="${{ github.event.inputs.cluster_name }}" --output json > cluster-info.json

          API_URL=$(jq -r '.api.url' cluster-info.json)
          DOMAIN=$(jq -r '.dns.base_domain' cluster-info.json)

          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "apps_domain=apps.${DOMAIN}" >> $GITHUB_OUTPUT

      - name: Login to OpenShift
        run: |
          oc login "${{ steps.cluster.outputs.api_url }}" \
            --username=cluster-admin \
            --password="${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            --insecure-skip-tls-verify=true

      - name: Add Confluent Helm repository
        run: |
          helm repo add confluentinc https://packages.confluent.io/helm
          helm repo update

      - name: Create Operator Namespace
        run: |
          oc create namespace confluent-operator --dry-run=client -o yaml | oc apply -f -

      - name: Deploy CFK Operator
        run: |
          helm upgrade --install confluent-operator confluentinc/confluent-for-kubernetes \
            --namespace confluent-operator \
            --version "${{ github.event.inputs.cfk_version }}" \
            --set podSecurityContext.runAsUser=1000 \
            --set podSecurityContext.runAsNonRoot=true \
            --set podSecurityContext.fsGroup=1000 \
            --set namespaced=false \
            --set namespaceList="{confluent}" \
            --wait \
            --timeout 10m

      - name: Grant SCC to Operator Service Account
        run: |
          oc adm policy add-scc-to-user confluent-scc \
            system:serviceaccount:confluent-operator:confluent-for-kubernetes || true

      - name: Verify CFK Operator Deployment
        run: |
          echo "Checking CFK Operator pods..."
          oc get pods -n confluent-operator

          echo ""
          echo "Checking CRDs..."
          oc get crds | grep confluent

          echo ""
          echo "Waiting for operator to be ready..."
          oc wait --for=condition=Available deployment/confluent-operator -n confluent-operator --timeout=300s

      - name: Generate Summary
        run: |
          echo "## CFK Operator Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ github.event.inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**CFK Version:** ${{ github.event.inputs.cfk_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installed CRDs" >> $GITHUB_STEP_SUMMARY
          oc get crds | grep confluent | awk '{print "- " $1}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "Run **08-Deploy Confluent Platform** workflow" >> $GITHUB_STEP_SUMMARY
