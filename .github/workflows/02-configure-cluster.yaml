name: 02-Configure Cluster

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'ROSA cluster name'
        required: true
        type: choice
        default: 'cfk-dev'
        options:
          - cfk-dev
          - cfk-stg
          - cfk-prd
          - cfk-dr
      environment:
        description: 'Environment to configure'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  configure:
    name: Configure OpenShift Cluster
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install ROSA CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/rosa/latest/rosa-linux.tar.gz
          tar -xzf rosa-linux.tar.gz
          sudo mv rosa /usr/local/bin/
          rosa version

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/
          oc version --client

      - name: Login to ROSA
        run: |
          rosa login --token="${{ secrets.RHCS_TOKEN }}"

      - name: Get Cluster Info
        id: cluster
        run: |
          rosa describe cluster --cluster="${{ github.event.inputs.cluster_name }}" --output json > cluster-info.json

          API_URL=$(jq -r '.api.url' cluster-info.json)
          CONSOLE_URL=$(jq -r '.console.url' cluster-info.json)
          DOMAIN=$(jq -r '.dns.base_domain' cluster-info.json)

          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "console_url=${CONSOLE_URL}" >> $GITHUB_OUTPUT
          echo "apps_domain=apps.${DOMAIN}" >> $GITHUB_OUTPUT

          echo "Cluster API: $API_URL"
          echo "Apps Domain: apps.${DOMAIN}"

      - name: Login to OpenShift
        run: |
          oc login "${{ steps.cluster.outputs.api_url }}" \
            --username=cluster-admin \
            --password="${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            --insecure-skip-tls-verify=true

      - name: Create Namespaces
        run: |
          oc apply -f - <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: confluent
            labels:
              app.kubernetes.io/managed-by: gitops
          ---
          apiVersion: v1
          kind: Namespace
          metadata:
            name: confluent-operator
            labels:
              app.kubernetes.io/managed-by: gitops
          ---
          apiVersion: v1
          kind: Namespace
          metadata:
            name: flink
            labels:
              app.kubernetes.io/managed-by: gitops
          EOF

      - name: Apply Security Context Constraints
        run: |
          oc apply -f env/dev/cluster-config/scc.yaml

      - name: Grant SCC to Service Accounts
        run: |
          # Grant SCC to Confluent Platform service accounts
          for sa in default kafka kraftcontroller schemaregistry connect ksqldb controlcenter kafkarestproxy; do
            oc adm policy add-scc-to-user confluent-scc -z $sa -n confluent 2>/dev/null || true
          done

          # Grant SCC to CFK operator service account
          oc adm policy add-scc-to-user confluent-scc -z confluent-for-kubernetes -n confluent-operator 2>/dev/null || true

          # Grant SCC to Flink service accounts (common defaults)
          for sa in default; do
            oc adm policy add-scc-to-user confluent-scc -z $sa -n flink 2>/dev/null || true
          done

      - name: Create Docker Hub Image Pull Secret
        run: |
          # Create dockerhub pull secret in confluent namespace
          oc create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKER_HUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_HUB_TOKEN }}" \
            --namespace=confluent \
            --dry-run=client -o yaml | oc apply -f -

          # Create dockerhub pull secret in confluent-operator namespace
          oc create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKER_HUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_HUB_TOKEN }}" \
            --namespace=confluent-operator \
            --dry-run=client -o yaml | oc apply -f -

          # Create dockerhub pull secret in flink namespace
          oc create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKER_HUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_HUB_TOKEN }}" \
            --namespace=flink \
            --dry-run=client -o yaml | oc apply -f -

          echo "Docker Hub image pull secrets created"

      - name: Create CA Certificate for TLS
        run: |
          # Generate CA certificate (used by CFK autoGeneratedCerts)
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /tmp/ca-key.pem \
            -out /tmp/ca.pem \
            -subj "/CN=confluent-ca/O=Confluent/C=US"

          # Create the CA secret that CFK uses for auto-generated certificates
          oc create secret tls ca-pair-sslcerts \
            --cert=/tmp/ca.pem \
            --key=/tmp/ca-key.pem \
            -n confluent \
            --dry-run=client -o yaml | oc apply -f -

          # Clean up temporary files
          rm -f /tmp/ca-key.pem /tmp/ca.pem

          echo ""
          echo "CA certificate created for TLS (autoGeneratedCerts will use this CA)"

      - name: Save Cluster Configuration
        run: |
          mkdir -p cluster-config

          cat > cluster-config/config.env << EOF
          CLUSTER_NAME=${{ github.event.inputs.cluster_name }}
          API_URL=${{ steps.cluster.outputs.api_url }}
          CONSOLE_URL=${{ steps.cluster.outputs.console_url }}
          APPS_DOMAIN=${{ steps.cluster.outputs.apps_domain }}
          ENVIRONMENT=${{ github.event.inputs.environment }}
          EOF

          cp cluster-info.json cluster-config/

      - name: Upload Cluster Configuration
        uses: actions/upload-artifact@v4
        with:
          name: cluster-config-${{ github.event.inputs.cluster_name }}
          path: cluster-config/
          retention-days: 90

      - name: Verify Configuration
        run: |
          echo "Verifying cluster configuration..."
          echo ""
          echo "Namespaces:"
          oc get namespaces | grep -E "confluent"
          echo ""
          echo "Security Context Constraints:"
          oc get scc confluent-scc
          echo ""
          echo "Secrets in confluent namespace:"
          oc get secrets -n confluent | grep -E "dockerhub-secret|ca-pair-sslcerts|tls"
          echo ""
          echo "Secrets in confluent-operator namespace:"
          oc get secrets -n confluent-operator | grep -E "dockerhub-secret"
          echo ""

      - name: Generate Summary
        run: |
          echo "## Cluster Configuration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ github.event.inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Apps Domain:** ${{ steps.cluster.outputs.apps_domain }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Created Resources" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: confluent" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: confluent-operator" >> $GITHUB_STEP_SUMMARY
          echo "- SecurityContextConstraints: confluent-scc" >> $GITHUB_STEP_SUMMARY
          echo "- Secret: dockerhub-secret (image pull)" >> $GITHUB_STEP_SUMMARY
          echo "- Secret: ca-pair-sslcerts (TLS CA certificate for autoGeneratedCerts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "Run **06-Deploy CFK Operator** workflow" >> $GITHUB_STEP_SUMMARY
