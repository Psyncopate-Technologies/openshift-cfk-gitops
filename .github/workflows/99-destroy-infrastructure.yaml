name: 99-Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      confirm:
        description: 'Type environment name to confirm'
        required: true
        type: string
      destroy_state_bucket:
        description: 'Also destroy Terraform state bucket'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.5.0"
  WORKING_DIR: infrastructure/terraform

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    if: github.event.inputs.confirm == github.event.inputs.environment
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=openshift-cfk-${{ github.event.inputs.environment }}.tfstate"

      - name: Terraform Plan Destroy
        run: |
          terraform plan -destroy \
            -var-file=environments/${{ github.event.inputs.environment }}.tfvars \
            -var="rhcs_token=${{ secrets.RHCS_TOKEN }}" \
            -out=tfplan-destroy

      - name: Terraform Destroy
        run: |
          terraform apply -auto-approve tfplan-destroy

      - name: Cleanup State Bucket
        if: github.event.inputs.destroy_state_bucket == 'true'
        run: |
          echo "Cleaning up Terraform state..."
          aws s3 rm s3://openshift-cfk-gitops-tfstate/openshift-cfk-${{ github.event.inputs.environment }}.tfstate || true

      - name: Generate Summary
        run: |
          echo "## Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**State Bucket Cleaned:** ${{ github.event.inputs.destroy_state_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All AWS infrastructure for the ${{ github.event.inputs.environment }} environment has been destroyed." >> $GITHUB_STEP_SUMMARY
