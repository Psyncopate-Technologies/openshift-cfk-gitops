name: 01-Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: 'plan'

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.5.0"
  WORKING_DIR: infrastructure/terraform

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="key=openshift-cfk-${{ github.event.inputs.environment }}.tfstate"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=environments/${{ github.event.inputs.environment }}.tfvars \
            -var="rhcs_token=${{ secrets.RHCS_TOKEN }}" \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform Outputs
        if: github.event.inputs.action == 'apply'
        id: outputs
        run: |
          terraform output -json > terraform-outputs.json

          # Extract key outputs for subsequent workflows
          echo "cluster_api_url=$(terraform output -raw cluster_api_url)" >> $GITHUB_OUTPUT
          echo "cluster_console_url=$(terraform output -raw cluster_console_url)" >> $GITHUB_OUTPUT
          echo "ecr_registry_url=$(terraform output -raw ecr_registry_url)" >> $GITHUB_OUTPUT
          echo "external_secrets_role_arn=$(terraform output -raw external_secrets_role_arn)" >> $GITHUB_OUTPUT
          echo "cert_manager_role_arn=$(terraform output -raw cert_manager_role_arn)" >> $GITHUB_OUTPUT
          echo "route53_zone_id=$(terraform output -raw route53_zone_id)" >> $GITHUB_OUTPUT

      - name: Upload Outputs Artifact
        if: github.event.inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ github.event.inputs.environment }}
          path: ${{ env.WORKING_DIR }}/terraform-outputs.json
          retention-days: 90

      - name: Generate Summary
        if: github.event.inputs.action == 'apply'
        run: |
          echo "## Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cluster Information" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** $(terraform output -raw cluster_api_url)" >> $GITHUB_STEP_SUMMARY
          echo "- **Console URL:** $(terraform output -raw cluster_console_url)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AWS Resources" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Registry:** $(terraform output -raw ecr_registry_url)" >> $GITHUB_STEP_SUMMARY
          echo "- **Route53 Zone ID:** $(terraform output -raw route53_zone_id)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### IAM Roles (for IRSA)" >> $GITHUB_STEP_SUMMARY
          echo "- **External Secrets:** $(terraform output -raw external_secrets_role_arn)" >> $GITHUB_STEP_SUMMARY
          echo "- **cert-manager:** $(terraform output -raw cert_manager_role_arn)" >> $GITHUB_STEP_SUMMARY
