name: 91-Destroy Confluent Platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'
      confirm:
        description: 'Type environment name to confirm'
        required: true
        type: string

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy Confluent Platform
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    if: github.event.inputs.confirm == github.event.inputs.environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs-${{ github.event.inputs.environment }}
          path: ./terraform-outputs
        continue-on-error: true

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Login to OpenShift
        run: |
          if [ -f "terraform-outputs/terraform-outputs.json" ]; then
            CLUSTER_API=$(jq -r '.cluster_api_url.value' terraform-outputs/terraform-outputs.json)
          else
            CLUSTER_API="${{ secrets.OPENSHIFT_API_URL }}"
          fi
          oc login "$CLUSTER_API" \
            --username=cluster-admin \
            --password="${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            --insecure-skip-tls-verify=true

      - name: Delete Confluent Platform Components
        run: |
          echo "Deleting Confluent Platform components..."

          # Delete in reverse dependency order
          oc delete kafkarestproxy --all -n confluent --ignore-not-found || true
          oc delete controlcenter --all -n confluent --ignore-not-found || true
          oc delete ksqldb --all -n confluent --ignore-not-found || true
          oc delete connect --all -n confluent --ignore-not-found || true
          oc delete schemaregistry --all -n confluent --ignore-not-found || true
          oc delete kafka --all -n confluent --ignore-not-found || true
          oc delete kraftcontroller --all -n confluent --ignore-not-found || true

          echo "Waiting for resources to be deleted..."
          sleep 60

      - name: Delete PVCs
        run: |
          echo "Deleting PersistentVolumeClaims..."
          oc delete pvc --all -n confluent --ignore-not-found || true

      - name: Verify Deletion
        run: |
          echo "Remaining resources in confluent namespace:"
          oc get all -n confluent

      - name: Generate Summary
        run: |
          echo "## Confluent Platform Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Confluent Platform components have been deleted." >> $GITHUB_STEP_SUMMARY
