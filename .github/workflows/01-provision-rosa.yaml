name: 01-Provision ROSA

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
          - dr
        default: 'dev'
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: 'plan'
      override_cluster_name:
        description: 'Override cluster name (default: cfk-<env>)'
        required: false
        default: ''
      override_compute_nodes:
        description: 'Override compute nodes (default: dev=2, others=3)'
        required: false
        default: ''
      override_instance_type:
        description: 'Override instance type (default: dev/stg=m5.xlarge, prd/dr=m5.2xlarge)'
        required: false
        type: choice
        options:
          - (use environment default)
          - m5.xlarge
          - m5.2xlarge
          - m5.4xlarge
        default: '(use environment default)'

env:
  AWS_REGION: us-east-1

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: env_vars
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "env_name=${ENV}" >> $GITHUB_OUTPUT

          # Set AWS region based on environment (DR uses us-west-2)
          if [ "$ENV" == "dr" ]; then
            echo "aws_region=us-west-2" >> $GITHUB_OUTPUT
          else
            echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.env_vars.outputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="env/${{ github.event.inputs.environment }}/backend.tfvars"
        env:
          TF_VAR_rhcs_token: ${{ secrets.RHCS_TOKEN }}

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: |
          # Build override arguments if provided
          OVERRIDE_ARGS=""
          if [ -n "${{ github.event.inputs.override_cluster_name }}" ]; then
            OVERRIDE_ARGS="$OVERRIDE_ARGS -var=cluster_name=${{ github.event.inputs.override_cluster_name }}"
          fi
          if [ -n "${{ github.event.inputs.override_compute_nodes }}" ]; then
            OVERRIDE_ARGS="$OVERRIDE_ARGS -var=compute_nodes=${{ github.event.inputs.override_compute_nodes }}"
          fi
          if [ -n "${{ github.event.inputs.override_instance_type }}" ] && [ "${{ github.event.inputs.override_instance_type }}" != "(use environment default)" ]; then
            OVERRIDE_ARGS="$OVERRIDE_ARGS -var=compute_machine_type=${{ github.event.inputs.override_instance_type }}"
          fi

          terraform plan \
            -var-file="env/${{ github.event.inputs.environment }}/terraform.tfvars" \
            -var="rhcs_token=${{ secrets.RHCS_TOKEN }}" \
            -var="admin_password=${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            $OVERRIDE_ARGS \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Upload Plan
        if: github.event.inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: terraform/tfplan
          retention-days: 7

      - name: Terraform Apply
        id: apply
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply -auto-approve tfplan
        env:
          TF_VAR_rhcs_token: ${{ secrets.RHCS_TOKEN }}
          TF_VAR_admin_password: ${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}

      - name: Terraform Destroy
        id: destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          # Build override arguments if provided
          OVERRIDE_ARGS=""
          if [ -n "${{ github.event.inputs.override_cluster_name }}" ]; then
            OVERRIDE_ARGS="$OVERRIDE_ARGS -var=cluster_name=${{ github.event.inputs.override_cluster_name }}"
          fi

          terraform destroy \
            -var-file="env/${{ github.event.inputs.environment }}/terraform.tfvars" \
            -var="rhcs_token=${{ secrets.RHCS_TOKEN }}" \
            -var="admin_password=${{ secrets.OPENSHIFT_ADMIN_PASSWORD }}" \
            $OVERRIDE_ARGS \
            -auto-approve
        env:
          TF_VAR_rhcs_token: ${{ secrets.RHCS_TOKEN }}

      - name: Get Outputs
        id: outputs
        if: github.event.inputs.action == 'apply'
        run: |
          echo "environment=$(terraform output -raw environment)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "console_url=$(terraform output -raw console_url)" >> $GITHUB_OUTPUT
          echo "apps_domain=$(terraform output -raw apps_domain)" >> $GITHUB_OUTPUT
          echo "custom_domain=$(terraform output -raw custom_domain)" >> $GITHUB_OUTPUT

      - name: Save Cluster Configuration
        if: github.event.inputs.action == 'apply'
        run: |
          mkdir -p ../cluster-config
          terraform output -json > ../cluster-config/terraform-outputs.json

          cat > ../cluster-config/config.env << EOF
          ENVIRONMENT=${{ github.event.inputs.environment }}
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          API_URL=$(terraform output -raw api_url)
          CONSOLE_URL=$(terraform output -raw console_url)
          APPS_DOMAIN=$(terraform output -raw apps_domain)
          CUSTOM_DOMAIN=$(terraform output -raw custom_domain)
          EOF

      - name: Upload Cluster Configuration
        if: github.event.inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: rosa-cluster-${{ github.event.inputs.environment }}-terraform
          path: cluster-config/
          retention-days: 90

      - name: Generate Summary
        if: always()
        run: |
          echo "## Terraform ${{ github.event.inputs.action }} Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ steps.env_vars.outputs.aws_region }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event.inputs.action }}" == "plan" ]; then
            echo "### Plan Status" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.plan.outcome }}" == "success" ]; then
              echo "Plan completed successfully. Review the plan output above." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "To apply changes, run this workflow again with:" >> $GITHUB_STEP_SUMMARY
              echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
              echo "- **Action:** apply" >> $GITHUB_STEP_SUMMARY
            else
              echo "Plan failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
            fi
          fi

          if [ "${{ github.event.inputs.action }}" == "apply" ]; then
            echo "### Cluster Details" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Environment** | ${{ steps.outputs.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Cluster Name** | ${{ steps.outputs.outputs.cluster_name }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **API URL** | ${{ steps.outputs.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Console URL** | ${{ steps.outputs.outputs.console_url }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Apps Domain** | ${{ steps.outputs.outputs.apps_domain }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Custom Domain** | ${{ steps.outputs.outputs.custom_domain }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### DNS Setup" >> $GITHUB_STEP_SUMMARY
            echo "Create a wildcard CNAME record:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "*.${{ steps.outputs.outputs.custom_domain }} -> *.${{ steps.outputs.outputs.apps_domain }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Run **02-configure-cluster** workflow with cluster: ${{ steps.outputs.outputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
            echo "2. Run **03-deploy-cfk-operator** workflow" >> $GITHUB_STEP_SUMMARY
            echo "3. Run **04-deploy-confluent-platform** workflow" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            echo "### Destroy Complete" >> $GITHUB_STEP_SUMMARY
            echo "Environment **${{ github.event.inputs.environment }}** cluster has been destroyed." >> $GITHUB_STEP_SUMMARY
          fi
