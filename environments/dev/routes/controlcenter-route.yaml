apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: controlcenter
  namespace: confluent
  annotations:
    haproxy.router.openshift.io/timeout: 60s
    haproxy.router.openshift.io/balance: roundrobin
spec:
  host: controlcenter.${APPS_DOMAIN}
  to:
    kind: Service
    name: controlcenter
    weight: 100
  port:
    targetPort: external
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
