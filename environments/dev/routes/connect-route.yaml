apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: connect
  namespace: confluent
  annotations:
    haproxy.router.openshift.io/timeout: 30s
spec:
  host: connect.${APPS_DOMAIN}
  to:
    kind: Service
    name: connect
    weight: 100
  port:
    targetPort: external
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
