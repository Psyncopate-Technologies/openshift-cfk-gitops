apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ksqldb
  namespace: confluent
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  host: ksqldb.${APPS_DOMAIN}
  to:
    kind: Service
    name: ksqldb
    weight: 100
  port:
    targetPort: external
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
