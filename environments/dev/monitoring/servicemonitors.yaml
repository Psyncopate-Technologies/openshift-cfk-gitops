apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka
  namespace: confluent
  labels:
    app: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  endpoints:
    - port: prometheus
      interval: 30s
      path: /metrics
  namespaceSelector:
    matchNames:
      - confluent
