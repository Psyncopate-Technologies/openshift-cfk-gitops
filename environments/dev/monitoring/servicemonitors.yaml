apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: confluent-alerts
  namespace: confluent
  labels:
    prometheus: user-workload
    role: alert-rules
spec:
  groups:
    - name: confluent.kafka
      rules:
        - alert: KafkaBrokerDown
          expr: up{job="kafka"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kafka broker is down"
            description: "Kafka broker {{ $labels.instance }} has been down for more than 5 minutes."

        - alert: KafkaUnderReplicatedPartitions
          expr: kafka_server_replicamanager_underreplicatedpartitions > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Kafka has under-replicated partitions"
            description: "Kafka broker {{ $labels.instance }} has {{ $value }} under-replicated partitions."

        - alert: KafkaOfflinePartitions
          expr: kafka_controller_kafkacontroller_offlinepartitionscount > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kafka has offline partitions"
            description: "Kafka cluster has {{ $value }} offline partitions."

        - alert: KafkaHighProducerLatency
          expr: kafka_network_requestmetrics_totaltimems{request="Produce"} > 1000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High Kafka producer latency"
            description: "Producer latency is {{ $value }}ms on {{ $labels.instance }}."

    - name: confluent.connect
      rules:
        - alert: ConnectConnectorFailed
          expr: kafka_connect_connector_status{status="failed"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kafka Connect connector failed"
            description: "Connector {{ $labels.connector }} has failed."

        - alert: ConnectTaskFailed
          expr: kafka_connect_connector_task_status{status="failed"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kafka Connect task failed"
            description: "Task {{ $labels.task }} in connector {{ $labels.connector }} has failed."

    - name: confluent.schemaregistry
      rules:
        - alert: SchemaRegistryDown
          expr: up{job="schemaregistry"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Schema Registry is down"
            description: "Schema Registry {{ $labels.instance }} has been down for more than 5 minutes."

    - name: confluent.ksqldb
      rules:
        - alert: KsqlDBDown
          expr: up{job="ksqldb"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ksqlDB is down"
            description: "ksqlDB {{ $labels.instance }} has been down for more than 5 minutes."
