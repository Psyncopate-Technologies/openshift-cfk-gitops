# Helm values for CFK Operator deployment
# These are passed to the confluent-for-kubernetes Helm chart

# Image configuration
image:
  registry: ${ECR_REGISTRY}/confluent
  repository: confluent-operator
  tag: "2.10.0"

# Security context for OpenShift
podSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true
  fsGroup: 1000

# Resource limits
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Namespaces to watch (empty = all namespaces)
namespaced: false
namespaceList:
  - confluent

# Image pull secrets
imagePullSecrets:
  - name: ecr-pull-secret

# Service account configuration
serviceAccount:
  create: true
  name: confluent-for-kubernetes

# Telemetry (disable for air-gapped)
telemetry:
  enabled: false

# License
license:
  secretRef: confluent-license
