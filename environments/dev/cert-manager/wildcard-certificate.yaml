apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls
  namespace: confluent
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: "*.apps.${ENVIRONMENT}.${DOMAIN_NAME}"
  dnsNames:
    - "*.apps.${ENVIRONMENT}.${DOMAIN_NAME}"
    - "apps.${ENVIRONMENT}.${DOMAIN_NAME}"
    - "*.${ENVIRONMENT}.${DOMAIN_NAME}"
  privateKey:
    algorithm: RSA
    size: 2048
  duration: 2160h    # 90 days
  renewBefore: 360h  # 15 days before expiry
