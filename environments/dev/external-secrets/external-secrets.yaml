apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: confluent-credentials
  namespace: confluent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: confluent-credentials
    creationPolicy: Owner
  data:
    - secretKey: kafka-admin-username
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: kafka_admin_username
    - secretKey: kafka-admin-password
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: kafka_admin_password
    - secretKey: sr-username
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: schema_registry_username
    - secretKey: sr-password
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: schema_registry_password
    - secretKey: connect-username
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: connect_username
    - secretKey: connect-password
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: connect_password
    - secretKey: ksqldb-username
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: ksqldb_username
    - secretKey: ksqldb-password
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: ksqldb_password
    - secretKey: controlcenter-username
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: controlcenter_username
    - secretKey: controlcenter-password
      remoteRef:
        key: confluent/${ENVIRONMENT}/credentials
        property: controlcenter_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: confluent-license
  namespace: confluent
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: confluent-license
    creationPolicy: Owner
  data:
    - secretKey: license.txt
      remoteRef:
        key: confluent/${ENVIRONMENT}/license
        property: license
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: confluent-jaas
  namespace: confluent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: confluent-jaas
    creationPolicy: Owner
  data:
    - secretKey: plain-users.json
      remoteRef:
        key: confluent/${ENVIRONMENT}/jaas
        property: plain_users
