apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestProxy
metadata:
  name: kafkarestproxy
  namespace: confluent
spec:
  replicas: 2
  image:
    application: ${ECR_REGISTRY}/confluent/cp-kafka-rest:8.0.1
    init: ${ECR_REGISTRY}/confluent/confluent-init-container:2.10.0
  podTemplate:
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kafkarestproxy
              topologyKey: topology.kubernetes.io/zone
  tls:
    autoGeneratedCerts: true
  externalAccess:
    type: route
    route:
      domain: apps.${ENVIRONMENT}.${DOMAIN_NAME}
  license:
    globalLicense: true
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
  configOverrides:
    server:
      - producer.acks=all
      - consumer.request.timeout.ms=30000
  metrics:
    prometheus:
      whitelist:
        - kafka.rest:type=jetty-metrics,*
        - kafka.rest:type=jersey-metrics,*
