apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 2
  image:
    application: ${ECR_REGISTRY}/confluent/cp-kafka-connect:8.0.1
    init: ${ECR_REGISTRY}/confluent/confluent-init-container:2.10.0
  podTemplate:
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - connect
              topologyKey: topology.kubernetes.io/zone
  tls:
    autoGeneratedCerts: true
  externalAccess:
    type: route
    route:
      domain: apps.${ENVIRONMENT}.${DOMAIN_NAME}
  license:
    globalLicense: true
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
  configOverrides:
    server:
      - config.storage.replication.factor=3
      - offset.storage.replication.factor=3
      - status.storage.replication.factor=3
      - connector.client.config.override.policy=All
  build:
    type: onDemand
    onDemand:
      plugins:
        locationType: confluentHub
        confluentHub:
          - name: kafka-connect-datagen
            owner: confluentinc
            version: "0.6.5"
          - name: kafka-connect-jdbc
            owner: confluentinc
            version: "10.7.6"
          - name: kafka-connect-s3
            owner: confluentinc
            version: "10.5.13"
          - name: kafka-connect-elasticsearch
            owner: confluentinc
            version: "14.0.15"
  metrics:
    prometheus:
      whitelist:
        - kafka.connect:type=connect-worker-metrics,*
        - kafka.connect:type=connect-worker-rebalance-metrics,*
        - kafka.connect:type=connector-metrics,*
        - kafka.connect:type=connector-task-metrics,*
        - kafka.connect:type=task-error-metrics,*
