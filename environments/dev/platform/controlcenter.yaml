apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  image:
    application: ${ECR_REGISTRY}/confluent/cp-control-center:8.0.1
    init: ${ECR_REGISTRY}/confluent/confluent-init-container:2.10.0
  dataVolumeCapacity: 10Gi
  storageClass:
    name: gp3-csi
  podTemplate:
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
  tls:
    autoGeneratedCerts: true
  externalAccess:
    type: route
    route:
      domain: apps.${ENVIRONMENT}.${DOMAIN_NAME}
  license:
    globalLicense: true
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
    connect:
      - name: connect
        url: https://connect.confluent.svc.cluster.local:8083
        tls:
          enabled: true
    ksqldb:
      - name: ksqldb
        url: https://ksqldb.confluent.svc.cluster.local:8088
        tls:
          enabled: true
  configOverrides:
    server:
      - confluent.controlcenter.internal.topics.replication=3
      - confluent.controlcenter.command.topic.replication=3
      - confluent.metrics.topic.replication=3
      - confluent.monitoring.interceptor.topic.replication=3
      - confluent.controlcenter.ui.autoupdate.enable=true
      - confluent.controlcenter.usage.data.collection.enable=false
  metrics:
    prometheus:
      whitelist:
        - io.confluent.controlcenter:*
