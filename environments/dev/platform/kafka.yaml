apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  image:
    application: ${ECR_REGISTRY}/confluent/cp-server:8.0.1
    init: ${ECR_REGISTRY}/confluent/confluent-init-container:2.10.0
  dataVolumeCapacity: 100Gi
  storageClass:
    name: gp3-csi
  podTemplate:
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "4"
        memory: 12Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - kafka
            topologyKey: topology.kubernetes.io/zone
  configOverrides:
    server:
      - auto.create.topics.enable=false
      - default.replication.factor=3
      - min.insync.replicas=2
      - num.partitions=6
      - log.retention.hours=168
      - log.segment.bytes=1073741824
      - log.retention.check.interval.ms=300000
  tls:
    autoGeneratedCerts: true
  listeners:
    internal:
      tls:
        enabled: true
    external:
      tls:
        enabled: true
        secretRef: wildcard-tls
      externalAccess:
        type: route
        route:
          domain: apps.${ENVIRONMENT}.${DOMAIN_NAME}
          wildcardPolicy: Subdomain
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
  license:
    globalLicense: true
  metricReporter:
    enabled: true
    bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
    tls:
      enabled: true
  metrics:
    prometheus:
      whitelist:
        - kafka.server:type=BrokerTopicMetrics,*
        - kafka.server:type=ReplicaManager,*
        - kafka.server:type=KafkaRequestHandlerPool,*
        - kafka.network:type=RequestMetrics,*
        - kafka.log:type=LogFlushStats,*
        - kafka.controller:*
