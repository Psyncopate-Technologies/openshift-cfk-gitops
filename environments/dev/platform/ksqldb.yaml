apiVersion: platform.confluent.io/v1beta1
kind: KsqlDB
metadata:
  name: ksqldb
  namespace: confluent
spec:
  replicas: 2
  image:
    application: ${ECR_REGISTRY}/confluent/cp-ksqldb-server:8.0.1
    init: ${ECR_REGISTRY}/confluent/confluent-init-container:2.10.0
  dataVolumeCapacity: 10Gi
  storageClass:
    name: gp3-csi
  podTemplate:
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - ksqldb
              topologyKey: topology.kubernetes.io/zone
  tls:
    autoGeneratedCerts: true
  externalAccess:
    type: route
    route:
      domain: apps.${ENVIRONMENT}.${DOMAIN_NAME}
  license:
    globalLicense: true
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
  configOverrides:
    server:
      - ksql.streams.replication.factor=3
      - ksql.internal.topic.replicas=3
      - ksql.logging.processing.topic.replication.factor=3
      - ksql.streams.num.standby.replicas=1
      - ksql.query.pull.enable.standby.reads=true
  metrics:
    prometheus:
      whitelist:
        - io.confluent.ksql.metrics:type=ksql-engine-query-stats,*
        - io.confluent.ksql.metrics:type=_confluent-ksql-*
